<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Cookie Exporter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        width: 360px;
        margin: 0;
        padding: 14px;
        color: #1f1f1f;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        line-height: 1.4;
        margin: 0 0 10px;
        color: #444;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #c8c8c8;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
      }
      button:hover {
        background: #ececec;
      }
      button.primary {
        background: #cc0000;
        border-color: #cc0000;
        color: #fff;
      }
      button.primary:hover {
        background: #b00000;
      }
      textarea {
        width: 100%;
        height: 110px;
        box-sizing: border-box;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        resize: vertical;
        border: 1px solid #c8c8c8;
        border-radius: 6px;
        padding: 8px;
      }
      #status {
        font-size: 12px;
        margin-top: 8px;
        min-height: 16px;
      }
      #status.ok {
        color: #1a7f37;
      }
      #status.error {
        color: #cc0000;
      }
      code {
        background: #f0f0f0;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>YouTube Cookie Exporter</h1>
    <p>
      Sign in to YouTube in this browser, then click <strong>Generate</strong>.
      Copy the value and set it as <code>YT_COOKIES_B64</code> in your
      <code>.env</code> file.
    </p>
    <div class="row">
      <button id="generate" class="primary">Generate</button>
      <button id="copy">Copy</button>
    </div>
    <textarea id="output" readonly placeholder="YT_COOKIES_B64 value appears here…"></textarea>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
